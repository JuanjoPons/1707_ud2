 canal y duración verificados el 13/11/2026","fromManual":"Del material de la unidad","complementary":"Complementaria (basada en el temario)","finalTitle":"Repaso de la sesión","finalSub":"Actividad autocorregible de repaso, elaborada a partir del temario de esta sesión.","weight":"Horas de la programación","fullText":"Lee el texto completo del apartado","rNoGlobal":"La web no calcula ninguna calificación: la fórmula de la programación (prueba 40 % + prácticas y guía 40 % + observación 20 %) se aplica a los instrumentos de evaluación del docente."},"ca":{"day":"Mòdul","blocks":"Unitat","uds":"Unitat didàctica","rDay":"Mòdul i sessions treballades","verified":"Enllaç, canal i durada verificats el 13/11/2026","fromManual":"Del material de la unitat","complementary":"Complementària (basada en el temari)","finalTitle":"Repàs de la sessió","finalSub":"Activitat autocorregible de repàs, elaborada a partir del temari d'aquesta sessió.","weight":"Hores de la programació","fullText":"Llegeix el text complet de l'apartat","rNoGlobal":"La web no calcula cap qualificació: la fórmula de la programació (prova 40 % + pràctiques i guia 40 % + observació 20 %) s'aplica als instruments d'avaluació del docent."}},"blocks":[{"id":"S1","ud":"UD2","title":["2.1–2.2. Canales de información y agentes de intermediación","2.1–2.2. Canals d'informació i agents d'intermediació"],"meta":{"ra_fp":"RA1 · RA3","ce_txt":"RA1 a, b, d, e, f, g · RA3 a, b","pes":["Bloques 2.1 (2,5 h) y 2.2 (3 h) de la programación","Blocs 2.1 (2,5 h) i 2.2 (3 h) de la programació"]},"sections":[{"num":1,"kind":"intro","title":["Presentación de la unidad","Presentació de la unitat"],"nodes":[{"t":"p","x":["El propósito de esta unidad es capacitar al alumnado en la selección rigurosa de cauces informativos, canales y fuentes del mercado laboral, así como en el conocimiento de las instituciones y agentes de intermediación laboral (SEPE, servicios autonómicos de empleo, agencias de colocación, ETT y redes profesionales). El alumnado aprenderá a diseñar una guía de recursos de empleo y formación adaptada a su sector y a aplicar con autonomía las herramientas y técnicas activas de búsqueda de empleo (carta de presentación, currículum vitae y metabuscadores y portales web) para afrontar con éxito los procesos de selección.","El propòsit d'aquesta unitat és capacitar l'alumnat en la selecció rigorosa de llits informatius, canals i fonts del mercat laboral, així com en el coneixement de les institucions i agents d'intermediació laboral (SEPE, serveis autonòmics d'ocupació, agències de col·locació, ETT i xarxes professionals). L'alumnat aprendrà a dissenyar una guia de recursos d'ocupació i formació adaptada al seu sector i a aplicar amb autonomia les eines i tècniques actives de cerca d'ocupació (carta de presentació, currículum vitae i metacercadors i portals web) per afrontar amb èxit els processos de selecció."]},{"t":"p","x":["La unidad tiene asignadas 15 horas lectivas (el 35 % de la carga lectiva del módulo de centro) dentro del módulo profesional M1707 «Orientación profesional en los grados A, B y C del Sistema de Formación Profesional», incardinado en el Certificado Profesional de Habilitación para la docencia (RD 86/2026).","La unitat té assignades 15 hores lectives (el 35 % de la càrrega lectiva del mòdul de centre) dins el mòdul professional M1707 «Orientació professional en els graus A, B i C del Sistema de Formació Professional», incardinat en el Certificat Professional en Habilitació per a la docència (RD 86/2026)."]},{"t":"h3","x":["Resultados de aprendizaje de la unidad","Resultats d'aprenentatge de la unitat"]},{"t":"defs","items":[[["RA1","RA1"],["Selecciona cauces informativos y estrategias de búsqueda y actualización de la información del entorno profesional y productivo, reflejándolos en la programación de orientación profesional de los grados A, B y C.","Selecciona llits informatius i estratègies de cerca i actualització de la informació de l'entorn professional i productiu, reflectint-los en la programació d'orientació professional dels graus A, B i C."]],[["RA2","RA2"],["Determina técnicas específicas en el proceso de información y orientación profesional al alumnado, empresas, organismos e instituciones de manera diferenciada, favoreciendo y facilitando su participación activa.","Determina tècniques específiques en el procés d'informació i orientació professional a l'alumnat, empreses, organismes i institucions de manera diferenciada, afavorint i facilitant la seva participació activa."]],[["RA3","RA3"],["Asesora al alumnado destinatario de la acción formativa sobre itinerarios formativos, formación profesional y oportunidades de empleo, permitiéndoles la cualificación y recualificación de manera personalizada.","Assessora l'alumnat destinatari de l'acció formativa sobre itineraris formatius, formació professional i oportunitats d'ocupació, cosa que els permet la qualificació i requalificació de manera personalitzada."]],[["RA5","RA5"],["Aplica competencias digitales en el proceso de búsqueda de información y orientación profesional, relacionándolo con el sector productivo al que se dirige.","Aplica competències digitals en el procés de cerca d'informació i orientació professional, relacionant-lo amb el sector productiu al qual es dirigeix."]]]},{"t":"h3","x":["Bloques de contenidos","Blocs de continguts"]},{"t":"table","rows":[[["Bloque","Bloc"],["Contenidos principales","Continguts principals"],["RA","RA"],["Horas","Hores"],["Sesión","Sessió"]],[["2.1. Canales de información del mercado laboral","2.1. Canals d'informació del mercat laboral"],["Canales y fuentes, ofertas de empleo, INE, EPA y Observatorio de las Ocupaciones.","Canals i fonts, ofertes d'ocupació, INE, EPA i Observatori de les Ocupacions."],["RA1 a · RA3 a","RA1 a · RA3 a"],["2,5","2,5"],["1","1"]],[["2.2. Agentes de orientación e intermediación","2.2. Agents d'orientació i intermediació"],["Redes profesionales, SEPE y SOIB, agencias de colocación, OPEA, intermediación, empresas de selección y ETT.","Xarxes professionals, SEPE i SOIB, agències de col·locació, OPEA, intermediació, empreses de selecció i ETT."],["RA1 b · RA3 b","RA1 b · RA3 b"],["3","3"],["1","1"]],[["2.3. Guía de recursos para el empleo y la formación","2.3. Guia de recursos per a l'ocupació i la formació"],["Identificación, organización y elaboración de la guía.","Identificació, organització i elaboració de la guia."],["RA1 e, f, g","RA1 e, f, g"],["2","2"],["2","2"]],[["2.4. Técnicas y herramientas de búsqueda","2.4. Tècniques i eines de cerca"],["Carta de presentación, CV, Europass y plataformas de búsqueda.","Carta de presentació, CV, Europass i plataformes de cerca."],["RA2 i · RA5 g","RA2 i · RA5 g"],["3","3"],["2","2"]],[["2.5. Canales de acceso y competencias digitales","2.5. Canals d'accés i competències digitals"],["Portales y búsqueda avanzada, marca digital, RGPD y LOPDGDD, IA y salud digital.","Portals i cerca avançada, marca digital, RGPD i LOPDGDD, IA i salut digital."],["RA5","RA5"],["2,5","2,5"],["3","3"]],[["2.6. Procesos de selección","2.6. Processos de selecció"],["Entrevista (método STAR), pruebas profesionales y preparación.","Entrevista (mètode STAR), proves professionals i preparació."],["RA1 c · RA2 i","RA1 c · RA2 i"],["2","2"],["3","3"]]]},{"t":"h3","x":["Evaluación de la unidad","Avaluació de la unitat"]},{"t":"table","rows":[[["Resultado de aprendizaje","Resultat d'aprenentatge"],["Peso en la UD2","Pes a la UD2"],["Instrumentos principales","Instruments principals"]],[["RA1","RA1"],["30 %","30 %"],["Guía digital de recursos y prueba objetiva","Guia digital de recursos i prova objectiva"]],[["RA2","RA2"],["15 %","15 %"],["Carta de presentación y simulador de entrevista","Carta de presentació i simulador d'entrevista"]],[["RA3","RA3"],["20 %","20 %"],["Mapa de fuentes del mercado y prueba objetiva","Mapa de fonts del mercat i prova objectiva"]],[["RA5","RA5"],["35 %","35 %"],["Perfil y CV Europass, auditoría digital y prueba objetiva","Perfil i CV Europass, auditoria digital i prova objectiva"]]]},{"t":"p","x":["Calificación de la UD2 = prueba objetiva × 0,40 + prácticas digitales y guía × 0,40 + evaluación competencial por observación × 0,20. Para superar la unidad hay que obtener 5,0 o más.","Qualificació de la UD2 = prova objectiva × 0,40 + pràctiques digitals i guia × 0,40 + avaluació competencial per observació × 0,20. Per superar la unitat cal obtenir 5,0 o més."]},{"t":"p","x":["Organización en el aula: 3 sesiones de 5,5 horas, cada una en dos partes (3 h + 2,5 h). Cada sesión tiene una actividad evaluable (A1UD2, A2UD2 y A3UD2) y actividades autocorregibles de repaso.","Organització a l'aula: 3 sessions de 5,5 hores, cadascuna en dues parts (3 h + 2,5 h). Cada sessió té una activitat avaluable (A1UD2, A2UD2 i A3UD2) i activitats autocorregibles de repàs."]}],"acts":[],"videos":[],"part":1,"time":["15 min","15 min"]},{"num":2,"kind":"theory","title":["2.1.1. Canales y fuentes de información","2.1.1. Canals i fonts d'informació"],"nodes":[{"t":"p","x":["Este bloque consiste en seleccionar, consultar y analizar las fuentes que aportan una visión actualizada y fiable del contexto sociolaboral, las empresas, las tendencias de contratación, los perfiles más demandados y los desajustes entre la oferta y la demanda laboral.","Aquest bloc consisteix a seleccionar, consultar i analitzar les fonts que aporten una visió actualitzada i fiable del context sociolaboral, les empreses, les tendències de contractació, els perfils més demandats i els desajustos entre l'oferta i la demanda laboral."]},{"t":"p","x":["Las fuentes informativas del mercado laboral son los canales, instituciones y estudios (como los observatorios o la Encuesta de Población Activa) que proporcionan datos estructurados sobre el entorno productivo y profesional. Los cauces informativos pueden ser públicos o privados, formales o informales, y deben aportar datos actualizados sobre las posibilidades de inserción y reinserción laboral.","Les fonts informatives del mercat laboral són els canals, institucions i estudis (com els observatoris o l'Enquesta de Població Activa) que proporcionen dades estructurades sobre l'entorn productiu i professional. Els llits informatius poden ser públics o privats, formals o informals, i han d'aportar dades actualitzades sobre les possibilitats d'inserció i reinserció laboral."]},{"t":"viz","v":{"type":"compare","cols":[{"i":"search","s":"info","x":["Fuentes primarias","Fonts primàries"],"items":[["Encuestas directas","Enquestes directes"],["Paneles de empresas","Panells d'empreses"]]},{"i":"book","s":"info","x":["Fuentes secundarias","Fonts secundàries"],"items":[["Estudios estadísticos","Estudis estadístics"],["Memorias sectoriales","Memòries sectorials"]]},{"i":"doc","s":"must","x":["Canales formales","Canals formals"],"items":[["Boletines oficiales","Butlletins oficials"],["Observatorios","Observatoris"]]},{"i":"chat","s":"safe","x":["Canales informales","Canals informals"],"items":[["Redes de contactos personales","Xarxes de contactes personals"],["Foros profesionales","Fòrums professionals"]]}]}},{"t":"links","title":null,"items":[{"i":"link","x":["Canals de recerca de feina (Barcelona Activa)","Canals de recerca de feina (Barcelona Activa)"],"d":["Presenta los canales por los que circulan las ofertas: portales, bolsas de trabajo, empresas de selección y redes sociales. Cada canal tiene sus propias características (en catalán).","Presenta els canals per on circulen les ofertes: portals, borses de treball, empreses de selecció i xarxes socials. Cada canal té les seves pròpies característiques."],"url":"https://treball.barcelonactiva.cat/ca/web/treball/canals-de-recerca-de-feina"}]}],"acts":["s1-fuentes","s1-canales"],"videos":[],"part":1,"time":["45 min","45 min"]},{"num":3,"kind":"theory","title":["2.1.2. Ofertas de empleo","2.1.2. Ofertes d'ocupació"],"nodes":[{"t":"p","x":["Consiste en el rastreo y el análisis comparativo de las ofertas de empleo publicadas por las empresas y los organismos, contrastando sus requisitos con las competencias de la persona candidata. Requiere un seguimiento sistemático de los anuncios de empleo en la prensa y en los medios digitales.","Consisteix en el rastreig i l'anàlisi comparativa de les ofertes d'ocupació publicades per les empreses i els organismes, contrastant-ne els requisits amb les competències de la persona candidata. Requereix un seguiment sistemàtic dels anuncis d'ocupació a la premsa i als mitjans digitals."]},{"t":"viz","v":{"type":"compare","vs":true,"cols":[{"i":"building","s":"info","x":["Ofertas públicas","Ofertes públiques"],"items":[["Oferta de empleo público (OPE)","Oferta d'ocupació pública (OPE)"],["Bolsas de trabajo de la Administración","Borses de treball de l'Administració"]]},{"i":"factory","s":"info","x":["Ofertas privadas","Ofertes privades"],"items":[["Publicadas por empresas y organismos privados","Publicades per empreses i organismes privats"]]}]}},{"t":"p","x":["Descodificar la letra pequeña de una oferta significa localizar estos elementos:","Descodificar la lletra petita d'una oferta significa localitzar aquests elements:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"wrench","s":"info","x":["Funciones","Funcions"],"d":["Qué tareas tendrá que hacer la persona contratada.","Quines tasques haurà de fer la persona contractada."]},{"i":"check","s":"must","x":["Requisitos imprescindibles","Requisits imprescindibles"],"d":["Sin ellos la candidatura no se tiene en cuenta.","Sense ells la candidatura no es té en compte."]},{"i":"star","s":"safe","x":["Requisitos deseables","Requisits desitjables"],"d":["Suman puntos, pero no excluyen.","Sumen punts, però no exclouen."]},{"i":"doc","s":"info","x":["Tipo de contrato y condiciones","Tipus de contracte i condicions"],"d":["Según el convenio colectivo de referencia.","Segons el conveni col·lectiu de referència."]}]}},{"t":"box","k":"idea","label":null,"nodes":[{"t":"p","x":["Idea clave: antes de responder a una oferta, contrasta cada requisito imprescindible con las competencias que puedes demostrar.","Idea clau: abans de respondre a una oferta, contrasta cada requisit imprescindible amb les competències que pots demostrar."]}]}],"acts":["s1-oferta"],"videos":[],"part":1,"time":["50 min","50 min"]},{"num":4,"kind":"theory","title":["2.1.3. Fuentes de información sobre el mercado laboral","2.1.3. Fonts d'informació sobre el mercat laboral"],"nodes":[{"t":"p","x":["Consiste en consultar los organismos oficiales de estadística y el análisis técnico del mercado de trabajo. Destacan el Instituto Nacional de Estadística (INE), que elabora la Encuesta de Población Activa (EPA) de forma trimestral desde 1964, y los observatorios de las ocupaciones.","Consisteix a consultar els organismes oficials d'estadística i l'anàlisi tècnica del mercat de treball. Destaquen l'Institut Nacional d'Estadística (INE), que elabora l'Enquesta de Població Activa (EPA) de manera trimestral des de 1964, i els observatoris de les ocupacions."]},{"t":"viz","v":{"type":"key","i":"chart","s":"info","big":["EPA · trimestral · desde 1964","EPA · trimestral · des de 1964"],"x":["Investigación continua dirigida a familias que realiza el INE para medir la fuerza de trabajo.","Investigació contínua adreçada a famílies que fa l'INE per mesurar la força de treball."]}},{"t":"p","x":["El INE es un organismo autónomo de carácter administrativo adscrito al Ministerio de Economía, Comercio y Empresa a través de la Secretaría de Estado de Economía y Apoyo a la Empresa. Realiza estadísticas demográficas, económicas e indicadores sociales; además de la EPA, ofrece el índice de precios de consumo (IPC) y las estadísticas de coste laboral.","L'INE és un organisme autònom de caràcter administratiu adscrit al Ministeri d'Economia, Comerç i Empresa a través de la Secretaria d'Estat d'Economia i Suport a l'Empresa. Fa estadístiques demogràfiques, econòmiques i indicadors socials; a més de l'EPA, ofereix l'índex de preus de consum (IPC) i les estadístiques de cost laboral."]},{"t":"p","x":["La EPA clasifica a la población de 16 o más años así:","L'EPA classifica la població de 16 anys o més així:"]},{"t":"viz","v":{"type":"compare","cols":[{"i":"user","s":"safe","x":["Activos: ocupados","Actius: ocupats"],"items":[["Han trabajado al menos una hora en la semana de referencia a cambio de una retribución (salario, jornal o beneficio) en dinero o en especie, o están ausentes temporalmente (vacaciones, enfermedad).","Han treballat almenys una hora en la setmana de referència a canvi d'una retribució (salari, jornal o benefici) en diners o en espècie, o en són absents temporalment (vacances, malaltia)."]]},{"i":"search","s":"warn","x":["Activos: desempleados","Actius: desocupats"],"items":[["Sin trabajo en la semana de referencia, disponibles para trabajar y buscando activamente empleo.","Sense feina en la setmana de referència, disponibles per treballar i cercant feina activament."]]},{"i":"home","s":"info","x":["Inactivos","Inactius"],"items":[["No suministran mano de obra para la producción: no son ni ocupados ni desempleados.","No subministren mà d'obra per a la producció: no són ni ocupats ni desocupats."]]}],"note":["Población activa: personas de 16 o más años que suministran mano de obra para la producción (ocupadas y desempleadas).","Població activa: persones de 16 anys o més que subministren mà d'obra per a la producció (ocupades i desocupades)."]}},{"t":"h3","x":["El Observatorio de las Ocupaciones del SEPE","L'Observatori de les Ocupacions del SEPE"]},{"t":"p","x":["Es la unidad técnica que investiga las necesidades del mercado, estudia tendencias, analiza perfiles y profundiza en los yacimientos de empleo. Publica informes de tendencias del mercado de trabajo, las ocupaciones con mayor contratación y los perfiles de difícil cobertura. Sus funciones son:","És la unitat tècnica que investiga les necessitats del mercat, estudia tendències, analitza perfils i aprofundeix en els jaciments d'ocupació. Publica informes de tendències del mercat de treball, les ocupacions amb més contractació i els perfils de difícil cobertura. Les seves funcions són:"]},{"t":"viz","v":{"type":"cards","cols":2,"items":[{"i":"search","s":"info","x":["Investigar elementos para las políticas de empleo","Investigar elements per a les polítiques d'ocupació"]},{"i":"chart","s":"info","x":["Estudiar las ocupaciones en crecimiento","Estudiar les ocupacions en creixement"]},{"i":"user","s":"info","x":["Ofrecer información de perfiles","Oferir informació de perfils"]},{"i":"globe","s":"info","x":["Realizar estudios territoriales y de prospectiva","Fer estudis territorials i de prospectiva"]},{"i":"bulb","s":"info","x":["Propiciar la búsqueda de nuevos yacimientos de empleo","Propiciar la cerca de nous jaciments d'ocupació"]},{"i":"chat","s":"info","x":["Asesorar técnicamente a agentes y ciudadanía","Assessorar tècnicament agents i ciutadania"]}]}},{"t":"p","x":["Completan el mapa los portales sectoriales y las cámaras de comercio, con informes de coyuntura económica regional y estudios del tejido empresarial local.","Completen el mapa els portals sectorials i les cambres de comerç, amb informes de conjuntura econòmica regional i estudis del teixit empresarial local."]},{"t":"links","title":null,"items":[{"i":"chart","x":["Tendencias del empleo (Observatorio de las Ocupaciones, SEPE)","Tendències de l'ocupació (Observatori de les Ocupacions, SEPE)"],"d":["Tendencias de las actividades económicas y datos de las ocupaciones. Es una fuente de análisis, no un portal que publica vacantes (acceso en catalán).","Tendències de les activitats econòmiques i dades de les ocupacions. És una font d'anàlisi, no un portal que publica vacants."],"url":"https://www.sepe.es/HomeSepe/ca/que-es-observatorio/tendencias-del-empleo.html"}]}],"acts":["s1-epa","s1-observ","s1-ficha-ocup"],"videos":[],"part":1,"time":["70 min","70 min"]},{"num":5,"kind":"theory","title":["2.2.1–2.2.3. Redes profesionales, servicios públicos de empleo y agencias","2.2.1–2.2.3. Xarxes professionals, serveis públics d'ocupació i agències"],"nodes":[{"t":"p","x":["La intermediación laboral es el proceso en el que agentes especializados (como ETT, agencias de colocación o servicios públicos) conectan a las personas demandantes de empleo con las empresas que necesitan personal. En este apartado se analiza el conjunto de entidades, públicas y privadas, que orientan, asesoran e intermedian.","La intermediació laboral és el procés en què agents especialitzats (com ETT, agències de col·locació o serveis públics) connecten les persones demandants d'ocupació amb les empreses que necessiten personal. En aquest apartat s'analitza el conjunt d'entitats, públiques i privades, que orienten, assessoren i fan d'intermediàries."]},{"t":"h3","x":["2.2.1. Redes sociales profesionales","2.2.1. Xarxes socials professionals"]},{"t":"p","x":["Son redes de contactos profesionales abiertas e interactivas para difundir información laboral, publicar la trayectoria individual y conectar de forma proactiva con seleccionadores de personal. LinkedIn es la red profesional más popular y de mayor escala del mundo, con millones de usuarios en más de 200 países y territorios; funciona como directorio de negocios y canal directo de reclutamiento y es gratuita, excepto algunos servicios avanzados de pago. También son espacios de encuentro ResearchGate y los foros sectoriales.","Són xarxes de contactes professionals obertes i interactives per difondre informació laboral, publicar la trajectòria individual i connectar de manera proactiva amb seleccionadors de personal. LinkedIn és la xarxa professional més popular i de més escala del món, amb milions d'usuaris en més de 200 països i territoris; funciona com a directori de negocis i canal directe de reclutament i és gratuïta, excepte alguns serveis avançats de pagament. També són espais de trobada ResearchGate i els fòrums sectorials."]},{"t":"h3","x":["2.2.2. SEPE y servicios públicos de empleo autonómicos","2.2.2. SEPE i serveis públics d'ocupació autonòmics"]},{"t":"viz","v":{"type":"cards","items":[{"i":"building","s":"info","x":["SEPE","SEPE"],"d":["Organismo autónomo de la Administración General del Estado, adscrito al Ministerio de Trabajo y Economía Social, que coordina las políticas activas de empleo y la intermediación pública.","Organisme autònom de l'Administració General de l'Estat, adscrit al Ministeri de Treball i Economia Social, que coordina les polítiques actives d'ocupació i la intermediació pública."]},{"i":"flag","s":"info","x":["Servicios autonómicos","Serveis autonòmics"],"d":["SOIB, SOC, SEFCARM, SERVEF y otros: gestionan programas de empleo, formación y orientación en su comunidad.","SOIB, SOC, SEFCARM, SERVEF i altres: gestionen programes d'ocupació, formació i orientació a la seva comunitat."]},{"i":"globe","s":"info","x":["EURES","EURES"],"d":["Red de cooperación entre la Comisión Europea, los servicios públicos de empleo, sindicatos y patronales para la libre circulación de trabajadores en el Espacio Económico Europeo.","Xarxa de cooperació entre la Comissió Europea, els serveis públics d'ocupació, sindicats i patronals per a la lliure circulació de treballadors a l'Espai Econòmic Europeu."]}]}},{"t":"p","x":["Todos forman el Sistema Nacional de Empleo (SNE). Su Cartera Común de Servicios incluye orientación profesional, gestión de ofertas, formación para el empleo y reconocimiento de competencias. EURES tiene tres objetivos: informar y orientar sobre empleo y condiciones de vida en el EEE, ayudar a las empresas a contratar personas de otros países y asesorar en las regiones fronterizas.","Tots formen el Sistema Nacional d'Ocupació (SNE). La seva Cartera Comuna de Serveis inclou orientació professional, gestió d'ofertes, formació per a l'ocupació i reconeixement de competències. EURES té tres objectius: informar i orientar sobre ocupació i condicions de vida a l'EEE, ajudar les empreses a contractar persones d'altres països i assessorar a les regions fronteres."]},{"t":"h3","x":["2.2.3. Agencias de colocación","2.2.3. Agències de col·locació"]},{"t":"p","x":["Son entidades públicas o privadas, con o sin ánimo de lucro, que colaboran con los servicios públicos de empleo en la intermediación laboral, valorando los perfiles y las necesidades de las personas usuarias. Necesitan acreditación oficial: el Sistema Nacional de Empleo ofrece un directorio telemático, ordenado por comunidades autónomas, para consultar las agencias autorizadas. La intermediación es gratuita para las personas demandantes de empleo.","Són entitats públiques o privades, amb ànim de lucre o sense, que col·laboren amb els serveis públics d'ocupació en la intermediació laboral, valorant els perfils i les necessitats de les persones usuàries. Necessiten acreditació oficial: el Sistema Nacional d'Ocupació ofereix un directori telemàtic, ordenat per comunitats autònomes, per consultar les agències autoritzades. La intermediació és gratuïta per a les persones demandants d'ocupació."]},{"t":"links","title":null,"items":[{"i":"doc","x":["Recerca activa d'ocupació (guía del SOIB, PDF)","Recerca activa d'ocupació (guia del SOIB, PDF)"],"d":["Canales y entidades para buscar empleo en las Illes Balears: servicios públicos, agencias, empresas de selección, portales y empleo público. Edición de octubre de 2023: comprueba los enlaces antes de usarlos (en catalán).","Canals i entitats per cercar feina a les Illes Balears: serveis públics, agències, empreses de selecció, portals i ocupació pública. Edició d'octubre de 2023: comprova els enllaços abans de fer-los servir."],"url":"https://soib.es/wp-content/uploads/2023/10/2-Recerca-activa-docupacio-CAT.pdf"},{"i":"handshake","x":["Agències de col·locació (SOIB)","Agències de col·locació (SOIB)"],"d":["Qué es una agencia de colocación, su coordinación con los servicios públicos y su doble función con personas y empresas (en catalán).","Què és una agència de col·locació, la seva coordinació amb els serveis públics i la seva doble funció amb persones i empreses."],"url":"https://soib.es/agencies-de-collocacio/"}]}],"acts":["s1-agencia"],"videos":[],"part":2,"time":["40 min","40 min"]},{"num":6,"kind":"theory","title":["2.2.4–2.2.6. Programas de orientación, intermediación y empresas de selección","2.2.4–2.2.6. Programes d'orientació, intermediació i empreses de selecció"],"nodes":[{"t":"h3","x":["2.2.4. Programas de orientación para el empleo y el autoempleo","2.2.4. Programes d'orientació per a l'ocupació i l'autoocupació"]},{"t":"p","x":["Son dispositivos y actuaciones de tutorización personalizada y de apoyo a las iniciativas emprendedoras. Las unidades OPEA (Orientación Profesional para el Empleo y Asistencia al Autoempleo) ofrecen asesoramiento individualizado, herramientas de búsqueda de trabajo y asesoramiento para emprender. Se completan con los itinerarios personalizados de inserción (IPI) y los programas de asesoramiento a personas emprendedoras y a proyectos de economía social.","Són dispositius i actuacions de tutorització personalitzada i de suport a les iniciatives emprenedores. Les unitats OPEA (Orientació Professional per a l'Ocupació i Assistència a l'Autoocupació) ofereixen assessorament individualitzat, eines de cerca de feina i assessorament per emprendre. Es completen amb els itineraris personalitzats d'inserció (IPI) i els programes d'assessorament a persones emprenedores i a projectes d'economia social."]},{"t":"links","title":null,"items":[{"i":"user","x":["Millora el teu perfil (SOIB)","Millora el teu perfil (SOIB)"],"d":["Asesoramiento para la búsqueda de empleo y la mejora del perfil, con itinerarios individualizados, orientación sobre formación y derivación a servicios especializados (en catalán).","Assessorament per a la cerca de feina i la millora del perfil, amb itineraris individualitzats, orientació sobre formació i derivació a serveis especialitzats."],"url":"https://soib.es/millora-el-teu-perfil/"},{"i":"heart","x":["Servei SOIB+","Servei SOIB+"],"d":["Atención personalizada, orientación, formación y apoyo en la selección para personas desempleadas de larga duración (en catalán).","Atenció personalitzada, orientació, formació i suport en la selecció per a persones desocupades de llarga durada."],"url":"https://soib.es/servei-soib-mes/"}]},{"t":"h3","x":["2.2.5. Intermediación laboral","2.2.5. Intermediació laboral"]},{"t":"p","x":["Es el procedimiento regulado por el que se analizan y se casan las necesidades de las empresas con los perfiles de las personas demandantes: selección, ajuste entre oferta y demanda (job matching) y seguimiento de la incorporación al puesto de trabajo.","És el procediment regulat pel qual s'analitzen i s'aparellen les necessitats de les empreses amb els perfils de les persones demandants: selecció, ajust entre oferta i demanda (job matching) i seguiment de la incorporació al lloc de treball."]},{"t":"viz","v":{"type":"chain","items":[{"i":"factory","s":"info","x":["Necesidad de la empresa","Necessitat de l'empresa"]},{"i":"megaphone","s":"info","x":["Oferta","Oferta"]},{"i":"group","s":"info","x":["Candidaturas","Candidatures"]},{"i":"filter","s":"info","x":["Preselección","Preselecció"]},{"i":"check","s":"safe","x":["Selección final","Selecció final"]}],"note":["Recorrido propuesto en la relación de recursos digitales a partir de «Necessitau personal?» del SOIB.","Recorregut proposat a la relació de recursos digitals a partir de «Necessitau personal?» del SOIB."]}},{"t":"links","title":null,"items":[{"i":"factory","x":["Necessitau personal? (SOIB Empreses)","Necessitau personal? (SOIB Empreses)"],"d":["La intermediación vista desde la empresa: preselección curricular, entrevistas de preselección y jornadas de selección o Job Days (en catalán).","La intermediació vista des de l'empresa: preselecció curricular, entrevistes de preselecció i jornades de selecció o Job Days."],"url":"https://soib.es/necessitau-personal/"}]},{ manual","time":["60 min","60 min"],"kind":["Evaluación","Avaluació"],"group":["Equipos","Equips"],"mode":["Escape room digital por niveles (Genially, Padlet, Google Forms)","Escape room digital per nivells (Genially, Padlet, Google Forms)"],"ra":"RA1","ce":"a, b, e, f, g","title":["Operación Radar Laboral. Escape room digital: «¿Quién tiene la información fiable?»","Operació Radar Laboral. Escape room digital: «Qui té la informació fiable?»"],"statement":[{"t":"p","x":["Tu equipo recibe una misión: localizar, verificar y clasificar fuentes del mercado laboral para elaborar una mini guía de recursos sobre un sector elegido (por ejemplo, turismo, comercio, tecnología o servicios socioculturales). Cada sala tiene un reto que desbloquea una pista.","El teu equip rep una missió: localitzar, verificar i classificar fonts del mercat laboral per elaborar una mini guia de recursos sobre un sector triat (per exemple, turisme, comerç, tecnologia o serveis socioculturals). Cada sala té un repte que desbloqueja una pista."]},{"t":"list","k":"ul","l":1,"items":[["Nivel 1 — Fuentes oficiales: identifica cuáles de varios enlaces son fuentes fiables (INE, SEPE, Observatorio de las Ocupaciones, EURES…).","Nivell 1 — Fonts oficials: identifica quins de diversos enllaços són fonts fiables (INE, SEPE, Observatori de les Ocupacions, EURES…)."],["Nivel 2 — Ofertas y perfiles: analiza una oferta real y extrae requisitos, funciones, condiciones y competencias demandadas.","Nivell 2 — Ofertes i perfils: analitza una oferta real i extreu-ne requisits, funcions, condicions i competències demandades."],["Nivel 3 — Agentes de intermediación: relaciona cada organismo con su función: SEPE, SOIB, ETT, agencias de colocación, consultoras y OPEA.","Nivell 3 — Agents d'intermediació: relaciona cada organisme amb la seva funció: SEPE, SOIB, ETT, agències de col·locació, consultores i OPEA."],["Nivel final — Guía exprés: cada equipo añade tres recursos a un mural colaborativo de Padlet, clasificados en «formación» y «empleo».","Nivell final — Guia exprés: cada equip afegeix tres recursos a un mural col·laboratiu de Padlet, classificats en «formació» i «ocupació»."]],"start":1},{"t":"p","x":["Resultado esperado: una guía digital de recursos con enlaces, clasificación y fecha de revisión.","Resultat esperat: una guia digital de recursos amb enllaços, classificació i data de revisió."]},{"t":"p","x":["Gamificación: puntos por respuestas correctas, insignias («Detective de datos», «Verificador de fuentes», «Arquitecto de recursos»), ranking de equipos y temporizador por nivel.","Gamificació: punts per respostes correctes, insígnies («Detectiu de dades», «Verificador de fonts», «Arquitecte de recursos»), rànquing d'equips i temporitzador per nivell."]}],"criteria":[{"ra":"RA1","title":["Selecciona cauces informativos y estrategias de búsqueda y actualización de la información del entorno profesional y productivo, reflejándolos en la programación de orientación profesional de los grados A, B y C.","Selecciona llits informatius i estratègies de cerca i actualització de la informació de l'entorn professional i productiu, reflectint-los en la programació d'orientació professional dels graus A, B i C."],"ce":[["CE1a",["Se han identificado las fuentes que ofrecen una visión actualizada del contexto sociolaboral, analizando las empresas u organismos equiparados del sector productivo y las condiciones y recursos del entorno.","S'han identificat les fonts que ofereixen una visió actualitzada del context sociolaboral, analitzant les empreses o organismes equiparats del sector productiu i les condicions i recursos de l'entorn."]],["CE1b",["Se han determinado las técnicas y estrategias de búsqueda de empleo que permiten mejorar las posibilidades de inserción y reinserción laboral (observatorios de empleo, ofertas de trabajo, redes sociales, empresas del sector, oficinas de empleo, consultorías, entre otras).","S'han determinat les tècniques i estratègies de cerca d'ocupació que permeten millorar les possibilitats d'inserció i reinserció laboral (observatoris d'ocupació, ofertes de treball, xarxes socials, empreses del sector, oficines d'ocupació, consultories, entre altres)."]],["CE1e",["Se han seleccionado las empresas u organismos del sector para la elaboración de una guía de recursos de empleo y formación de un contexto profesional determinado.","S'han seleccionat les empreses o organismes del sector per a l'elaboració d'una guia de recursos d'ocupació i formació d'un context professional determinat."]],["CE1f",["Se han revisado y consultado publicaciones, actividades, seminarios, redes profesionales y foros, entre otros, para la elaboración de una guía de recursos de empleo y formación de un contexto profesional determinado.","S'han revisat i consultat publicacions, activitats, seminaris, xarxes professionals i fòrums, entre altres, per a l'elaboració d'una guia de recursos d'ocupació i formació d'un context professional determinat."]],["CE1g",["Se han llevado a cabo acciones de organización, consulta y actualización de la información para la elaboración de una guía de recursos de empleo y formación de un contexto profesional determinado.","S'han dut a terme accions d'organització, consulta i actualització de la informació per a l'elaboració d'una guia de recursos d'ocupació i formació d'un context professional determinat."]]]}],"embed":{"t":"embed","title":["Operación Radar Laboral (Genially)","Operació Radar Laboral (Genially)"],"src":"https://view.genially.com/6af502e198303e7f3d76b031","url":"https://view.genially.com/6af502e198303e7f3d76b031","ratio":"16:9","h":null},"links":{"t":"links","title":["Enlace de respaldo","Enllaç de reserva"],"items":[{"i":"edit","x":["¿No carga? Abre el cuestionario en una pestaña nueva (Google Forms)","No es carrega? Obre el qüestionari en una pestanya nova (Google Forms)"],"d":["Inicia sesión con tu cuenta del centro.","Inicia la sessió amb el teu compte del centre."],"url":"https://docs.google.com/for uen les sigles OPEA?"],"opts":[["Oficina Pública de Empleo Autonómica","Oficina Pública d'Ocupació Autonòmica"],["Orientación Profesional para el Empleo y Asistencia al Autoempleo","Orientació Professional per a l'Ocupació i Assistència a l'Autoocupació"],["Observatorio de Profesiones Emergentes y Actividades","Observatori de Professions Emergents i Activitats"]],"ans":1,"exp":["Apartado 2.2.4.","Apartat 2.2.4."]}],"block":"S1","origin":"complementaria"}],"notes":[["Texto de la unidad: programación didáctica de la UD2 (en catalán) y temario de la UD2 (en castellano); cada texto se ha traducido con fidelidad al otro idioma. Los criterios de evaluación son el texto completo del documento «Estructuración UD2 y RAs».","Text de la unitat: programació didàctica de la UD2 (en català) i temari de la UD2 (en castellà); cada text s'ha traduït amb fidelitat a l'altre idioma. Els criteris d'avaluació són el text complet del document «Estructuració UD2 i RA»."]],"cover":{"signs":[["info","search",["Fuentes primarias y secundarias","Fonts primàries i secundàries"]],["info","chart",["INE: la EPA, trimestral desde 1964","INE: l'EPA, trimestral des de 1964"]],["must","doc",["Requisitos imprescindibles ≠ deseables","Requisits imprescindibles ≠ desitjables"]],["safe","handshake",["Agencia de colocación: gratuita para quien busca empleo","Agència de col·locació: gratuïta per a qui cerca feina"]],["warn","building",["ETT: contrata y cede (Ley 14/1994)","ETT: contracta i cedeix (Llei 14/1994)"]]],"lead":["Seleccionar con rigor los cauces informativos y conocer a los agentes de intermediación es el punto de partida para orientar la búsqueda de empleo con datos fiables y actualizados.","Seleccionar amb rigor els llits informatius i conèixer els agents d'intermediació és el punt de partida per orientar la cerca d'ocupació amb dades fiables i actualitzades."]},"art":"search","parts":[{"title":["Canales, ofertas y fuentes del mercado laboral","Canals, ofertes i fonts del mercat laboral"],"time":["3 h","3 h"],"min":180},{"title":["Agentes de intermediación y Operación Radar Laboral","Agents d'intermediació i Operació Radar Laboral"],"time":["2,5 h","2,5 h"],"min":150}]},{"id":"S2","ud":"UD2","title":["2.3–2.4. Guía de recursos y herramientas de búsqueda de empleo","2.3–2.4. Guia de recursos i eines de cerca d'ocupació"],"meta":{"ra_fp":"RA1 · RA2 · RA3 · RA5","ce_txt":"RA1 d, e, f, g · RA2 i · RA3 a, b, c · RA5 c, g","pes":["Bloques 2.3 (2 h) y 2.4 (3 h) de la programación","Blocs 2.3 (2 h) i 2.4 (3 h) de la programació"]},"sections":[{"num":1,"kind":"theory","title":["2.3.1. Identificación de recursos","2.3.1. Identificació de recursos"],"nodes":[{"t":"p","x":["La guía de recursos para el empleo y la formación es un documento catalogado que reúne información sobre herramientas, servicios, empresas y acciones formativas disponibles para facilitar la inserción laboral y la mejora de las cualificaciones. Para elaborarla hay que:","La guia de recursos per a l'ocupació i la formació és un document catalogat que reuneix informació sobre eines, serveis, empreses i accions formatives disponibles per facilitar la inserció laboral i la millora de les qualificacions. Per elaborar-la cal:"]},{"t":"viz","v":{"type":"steps","items":[{"i":"search","s":"info","x":["Identificar","Identificar"],"d":["Organismos, empresas del sector, características representativas y medidas de fomento.","Organismes, empreses del sector, característiques representatives i mesures de foment."]},{"i":"link","s":"info","x":["Relacionar","Relacionar"],"d":["Publicaciones, actividades, seminarios, redes profesionales y foros.","Publicacions, activitats, seminaris, xarxes professionals i fòrums."]},{"i":"folder","s":"safe","x":["Organizar","Organitzar"],"d":["La información, asegurando mecanismos de consulta y actualización permanente.","La informació, assegurant mecanismes de consulta i actualització permanent."]}]}},{"t":"p","x":["La identificación es la fase de rastreo y selección de recursos según el territorio y el sector profesional elegidos: entidades de formación reglada y no reglada, centros integrados de FP, parques tecnológicos, asociaciones empresariales, colegios profesionales, entidades del tercer sector y recursos de apoyo a la discapacidad o a la vulnerabilidad social.","La identificació és la fase de rastreig i selecció de recursos segons el territori i el sector professional triats: entitats de formació reglada i no reglada, centres integrats d'FP, parcs tecnològics, associacions empresarials, col·legis professionals, entitats del tercer sector i recursos de suport a la discapacitat o a la vulnerabilitat social."]},{"t":"box","k":"important","label":null,"nodes":[{"t":"p","x":["Importante: el muestreo se adapta a los perfiles de las personas participantes y atiende a los colectivos con necesidades especiales (NEAE) o con dificultades de inserción.","Important: el mostreig s'adapta als perfils de les persones participants i atén els col·lectius amb necessitats especials (NEAE) o amb dificultats d'inserció."]}]},{"t":"links","title":null,"items":[{"i":"folder","x":["Recursos d'orientació (Red COE, SOIB)","Recursos d'orientació (Xarxa COE, SOIB)"],"d":["Guías de búsqueda de empleo, materiales para profesionales de la orientación y vídeos de asesoramiento a empresas (en catalán y castellano).","Guies de cerca de feina, materials per a professionals de l'orientació i vídeos d'assessorament a empreses (en català i castellà)."],"url":"https://formaciocoe.soib.es/course/index.php?categoryid=3"}]}],"acts":["s2-coe"],"videos":[],"part":1,"time":["45 min","45 min"]},{"num":2,"kind":"theory","title":["2.3.2. Organización de recursos","2.3.2. Organització de recursos"],"nodes":[{"t":"p","x":["Los recursos se clasifican por temas en dos categorías principales:","Els recursos es classifiquen per temes en dues categories principals:"]},{"t":"viz","v":{"type":"compare","vs":true,"cols":[{"i":"learn","s":"info","x":["Recursos de formación","Recursos de formació"],"items":[["Educación reglada y no reglada, planes de formación y convocatorias.","Educació reglada i no reglada, plans de formació i convocatòries."],["Cursos más demandados, seminarios, congresos y centros que los imparten.","Cursos més demandats, seminaris, congressos i centres que els imparteixen."],["Ejemplo: buscador de centros de Formación Profesional para el Empleo del SEPE (por ubicación, especialidad u ocupación).","Exemple: cercador de centres de Formació Professional per a l'Ocupació del SEPE (per ubicació, especialitat o ocupació)."]]},{"i":"money","s":"safe","x":["Recursos de empleo","Recursos d'ocupació"],"items":[["Portales públicos autonómicos (sección «Punto de encuentro»).","Portals públics autonòmics (secció «Punt de trobada»)."],["Listados de agencias de colocación autorizadas por el Sistema Nacional de Empleo.","Llistats d'agències de col·locació autoritzades pel Sistema Nacional d'Ocupació."]]}]}},{"t":"p","x":["Otros criterios de clasificación: ámbito geográfico (local, comarcal, autonómico, estatal, europeo), sector de actividad, colectivo destinatario y tipo de servicio (orientación, formación, prácticas, gestión de ofertas). Cada recurso se recoge en una ficha con datos de contacto, dirección y formas de acceso directo para las personas usuarias del servicio de orientación.","Altres criteris de classificació: àmbit geogràfic (local, comarcal, autonòmic, estatal, europeu), sector d'activitat, col·lectiu destinatari i tipus de servei (orientació, formació, pràctiques, gestió d'ofertes). Cada recurs es recull en una fitxa amb dades de contacte, adreça i formes d'accés directe per a les persones usuàries del servei d'orientació."]}],"acts":["s2-bloques"],"videos":[],"part":1,"time":["35 min","35 min"]},{"num":3,"kind":"theory","title":["2.3.3. Elaboración de una guía de recursos","2.3.3. Elaboració d'una guia de recursos"],"nodes":[{"t":"p","x":["Es el diseño y la estructuración de una guía de recursos actualizada, dinámica y accesible, asegurando canales abiertos para su revisión periódica. Incluye un protocolo de actualización de los datos de contacto, los requisitos de acceso y el catálogo de servicios. Corresponde al supuesto práctico CE2.3 de la normativa.","És el disseny i l'estructuració d'una guia de recursos actualitzada, dinàmica i accessible, assegurant canals oberts per a la seva revisió periòdica. Inclou un protocol d'actualització de les dades de contacte, els requisits d'accés i el catàleg de serveis. Correspon al supòsit pràctic CE2.3 de la normativa."]},{"t":"h3","x":["Campos de cada recurso de la guía","Camps de cada recurs de la guia"]},{"t":"table","rows":[[["Campo","Camp"],["Información que recoge","Informació que recull"]],[["Nombre y entidad responsable","Nom i entitat responsable"],["Identificación del recurso.","Identificació del recurs."]],[["Tipo","Tipus"],["Orientación, formación, intermediación, ofertas, selección o autoempleo.","Orientació, formació, intermediació, ofertes, selecció o autoocupació."]],[["Destinatarios","Destinataris"],["Perfil de las personas a las que se dirige.","Perfil de les persones a les quals s'adreça."]],[["Servicios","Serveis"],["Qué ayuda o información proporciona.","Quina ajuda o informació proporciona."]],[["Acceso","Accés"],["Requisitos, procedimiento y ámbito territorial.","Requisits, procediment i àmbit territorial."]],[["Enlace y contacto","Enllaç i contacte"],["Vías de consulta.","Vies de consulta."]],[["Accesibilidad y apoyos","Accessibilitat i suports"],["Idiomas, formatos y adaptaciones identificadas.","Idiomes, formats i adaptacions identificades."]],[["Actualización","Actualització"],["Fecha de revisión y persona responsable.","Data de revisió i persona responsable."]]]},{"t":"links","title":null,"items":[{"i":"globe","x":["Guia EURES (SOIB, PDF)","Guia EURES (SOIB, PDF)"],"d":["Explica la red EURES, sus servicios, la búsqueda de empleo en Europa y Europass. Sirve también como ejemplo de cómo organizar una guía temática (en catalán).","Explica la xarxa EURES, els seus serveis, la cerca de feina a Europa i Europass. Serveix també com a exemple de com organitzar una guia temàtica."],"url":"https://soib.es/wp-content/uploads/2024/12/Guia-Eures-catalaactualitzat.pdf"}]}],"acts":["s2-pasos","s2-ficha"],"videos":[],"part":1,"time":["45 min","45 min"]},{"num":4,"kind":"theory","title":["2.4–2.4.1. Búsqueda activa de empleo y carta de presentación","2.4–2.4.1. Cerca activa d'ocupació i carta de presentació"],"nodes":[{"t":"p","x":["La búsqueda activa de empleo (BAE) es un proceso estructurado que incluye el conjunto de actividades, estrategias, actitudes y herramientas dirigidas al entrenamiento, la organización y la ejecución planificada para maximizar las probabilidades de inserción laboral. Las técnicas de búsqueda son estrategias y procedimientos estructurados, como redactar el currículum o la carta de presentación, para destacar en los procesos de selección.","La cerca activa d'ocupació (CAO) és un procés estructurat que inclou el conjunt d'activitats, estratègies, actituds i eines adreçades a l'entrenament, l'organització i l'execució planificada per maximitzar les probabilitats d'inserció laboral. Les tècniques de cerca són estratègies i procediments estructurats, com redactar el currículum o la carta de presentació, per destacar en els processos de selecció."]},{"t":"viz","v":{"type":"cards","cols":2,"title":["Vías y técnicas de acceso al empleo","Vies i tècniques d'accés a l'ocupació"],"items":[{"i":"group","s":"info","x":["Contactos personales (networking)","Contactes personals (networking)"]},{"i":"megaphone","s":"info","x":["Respuesta a anuncios impresos o digitales","Resposta a anuncis impresos o digitals"]},{"i":"mail","s":"info","x":["Autocandidatura","Autocandidatura"],"d":["Candidatura espontánea por correo postal, electrónico o en mano.","Candidatura espontània per correu postal, electrònic o en mà."]},{"i":"building","s":"info","x":["Inscripción en ETT","Inscripció en ETT"]},{"i":"laptop","s":"info","x":["Inscripción en portales públicos y privados","Inscripció en portals públics i privats"]},{"i":"learn","s":"info","x":["«Estar ocupado»","«Estar ocupat»"],"d":["Mantenerse activo en formación o trabajos temporales.","Mantenir-se actiu en formació o feines temporals."]}]}},{"t":"box","k":"idea","label":null,"nodes":[{"t":"p","x":["Idea clave: la búsqueda activa de empleo se planifica con el rigor de una jornada de trabajo.","Idea clau: la cerca activa d'ocupació es planifica amb el rigor d'una jornada de treball."]}]},{"t":"h3","x":["2.4.1. Carta de presentación","2.4.1. Carta de presentació"]},{"t":"p","x":["Es un documento breve y personalizado que acompaña al currículum para presentar la candidatura a una oferta o en una autocandidatura, argumentando las actitudes, la motivación y la adecuación del perfil al puesto. Hay dos tipos: respuesta a una oferta publicada y autocandidatura. El tono y el contenido se adaptan a la cultura de la organización.","És un document breu i personalitzat que acompanya el currículum per presentar la candidatura a una oferta o en una autocandidatura, argumentant les actituds, la motivació i l'adequació del perfil al lloc. N'hi ha dos tipus: resposta a una oferta publicada i autocandidatura. El to i el contingut s'adapten a la cultura de l'organització."]},{"t":"viz","v":{"type":"steps","title":["Estructura de la carta","Estructura de la carta"],"items":[{"i":"doc","x":["Encabezado","Capçalera"]},{"i":"bulb","x":["Gancho inicial","Ganxo inicial"],"d":["Capta la atención de quien selecciona.","Capta l'atenció de qui selecciona."]},{"i":"star","x":["Valor añadido y competencias","Valor afegit i competències"],"d":["Por qué encajas en el puesto.","Per què encaixes en el lloc."]},{"i":"phone","x":["Llamada a la acción","Crida a l'acció"],"d":["Solicita la entrevista.","Sol·licita l'entrevista."]}]}},{"t":"viz","v":{"type":"cards","title":["Normas formales","Normes formals"],"items":[{"i":"laptop","s":"must","x":[" delo normalizado de la UE.","Model normalitzat de la UE."]}]}},{"t":"p","x":["Elementos clave: resumen profesional, experiencia laboral ajustada al perfil, formación reglada y complementaria y competencias clave.","Elements clau: resum professional, experiència laboral ajustada al perfil, formació reglada i complementària i competències clau."]},{"t":"links","title":null,"items":[{"i":"doc","x":["Quiero mejorar mi CV (Barcelona Activa)","Quiero mejorar mi CV (Barcelona Activa)"],"d":["Modelos de currículum y de carta de presentación, asesoramiento y recursos de búsqueda de empleo (en castellano).","Models de currículum i de carta de presentació, assessorament i recursos de cerca de feina (en castellà)."],"url":"https://treball.barcelonactiva.cat/es/mejorar-curriculum"}]}],"acts":["s2-cv","s2-cv-comp"],"videos":[],"part":2,"time":["35 min","35 min"]},{"num":6,"kind":"theory","title":["2.4.3–2.4.4. CV europeo (Europass) y plataformas de búsqueda","2.4.3–2.4.4. CV europeu (Europass) i plataformes de cerca"],"nodes":[{"t":"p","x":["Europass es el modelo normalizado que promueven las instituciones de la Unión Europea para homogeneizar la presentación del perfil, facilitar la transparencia de las cualificaciones y la movilidad laboral entre países (red EURES). Su ecosistema incluye el perfil Europass, el pasaporte de competencias, el suplemento al título o certificado y herramientas de autoevaluación de las competencias digitales (DigComp) y lingüísticas (MCER).","Europass és el model normalitzat que promouen les institucions de la Unió Europea per homogeneïtzar la presentació del perfil, facilitar la transparència de les qualificacions i la mobilitat laboral entre països (xarxa EURES). El seu ecosistema inclou el perfil Europass, el passaport de competències, el suplement al títol o certificat i eines d'autoavaluació de les competències digitals (DigComp) i lingüístiques (MECR)."]},{"t":"viz","v":{"type":"compare","vs":true,"cols":[{"i":"folder","s":"info","x":["Perfil E na formació recomanar i quins recursos activar."]},{"t":"list","k":"ul","l":1,"items":[["El sistema presenta un perfil, por ejemplo: «Persona de 24 años, con FP de Administración, interesada en empleo digital en Menorca».","El sistema presenta un perfil, per exemple: «Persona de 24 anys, amb FP d'Administració, interessada en ocupació digital a Menorca»."],["Eliges las fuentes: INE/EPA, Observatorio del SEPE, SOIB, cámaras, centros de FP o redes profesionales.","Tries les fonts: INE/EPA, Observatori del SEPE, SOIB, cambres, centres d'FP o xarxes professionals."],["Seleccionas itinerarios: certificado profesional, curso de especialización, prácticas, autoempleo o recualificación digital.","Selecciones itineraris: certificat professional, curs d'especialització, pràctiques, autoocupació o requalificació digital."],["Cada decisión tiene consecuencias: «has identificado una necesidad de formación», «has detectado un recurso de apoyo», «has mejorado la empleabilidad del caso» o «has elegido una fuente desactualizada».","Cada decisió té conseqüències: «has identificat una necessitat de formació», «has detectat un recurs de suport», «has millorat l'ocupabilitat del cas» o «has triat una font desactualitzada»."]],"start":1},{"t":"p","x":["Resultado esperado: un itinerario personalizado con diagnóstico, recursos seleccionados, formación recomendada y justificación de las decisiones.","Resultat esperat: un itinerari personalitzat amb diagnòstic, recursos seleccionats, formació recomanada i justificació de les decisions."]},{"t":"p","x":["Gamificación: «energía orientadora», monedas por decisiones fundamentadas, misiones secundarias sobre inclusión laboral, NEAE o dificultades de inserción y un mapa de progreso con rutas alternativas.","Gamificació: «energia orientadora», monedes per decisions fonamentades, missions secundàries sobre inclusió laboral, NEAE o dificultats d'inserció i un mapa de progrés amb rutes alternatives."]}],"criteria":[{"ra":"RA3","title":["Asesora al alu cias digitales y los cauces telemáticos para localizar datos sobre la oferta de empleo y la formación continua. Los portales de empleo son sitios web especializados, públicos o privados, que reúnen información del mercado, publican vacantes e intermedian entre empresas y candidaturas.","Aquest bloc aplica les competències digitals i els llits telemàtics per localitzar dades sobre l'oferta d'ocupació i la formació contínua. Els portals d'ocupació són llocs web especialitzats, públics o privats, que reuneixen informació del mercat, publiquen vacants i fan d'intermediaris entre empreses i candidatures."]},{"t":"viz","v":{"type":"compare","vs":true,"cols":[{"i":"building","s":"info","x":["Portales públicos","Portals públics"],"items":[["Gestionados por la Administración: red EURES, SEPE, SOIB y servicios autonómicos.","Gestionats per l'Administració: xarxa EURES, SEPE, SOIB i serveis autonòmics."]]},{"i":"laptop","s":"info","x":["Portales privados","Portals privats"],"items":[["Gestionados por empresas (InfoJobs, Infoempleo, Trabajos.com).","Gestionats per empreses (InfoJobs, Infoempleo, Trabajos.com)."],["Generalistas (todos los sectores) o especializados (un sector).","Generalistes (tots els sectors) o especialitzats (un sector)."]]}]}},{"t":"p","x":["La búsqueda avanzada con operadores booleanos y filtros permite afinar los resultados y automatizar alertas de empleo en los portales institucionales y privados:","La cerca avançada amb operadors booleans i filtres permet afinar els resultats i automatitzar alertes d'ocupació als portals institucionals i privats:"]},{"t":"table","rows":[[["Operador","Operador"],["Qué hace","Què fa"],["Ejemplo","Exemple"]],[["AND","AND"],["Exige que aparezcan todos los términos.","Exigeix que apareguin tots els termes."],["administrativo AND Menorca","administratiu AND Menorca"]],[["OR","OR"],["Acepta cualquiera de los términos.","Accepta qualsevol dels termes."],["recepcionista OR conserje","recepcionista OR conserge"]],[["NOT","NOT"],[" ye","s":"warn","big":["Huella digital","Petjada digital"],"x":["El rastro de datos, informaciones, publicaciones e interacciones que una persona deja en internet y que configura su reputación en línea ante quienes seleccionan.","El rastre de dades, informacions, publicacions i interaccions que una persona deixa a internet i que configura la seva reputació en línia davant de qui selecciona."]}},{"t":"p","x":["La identidad digital profesional se construye y se gestiona: hay que analizar la propia huella y la reputación en línea, aplicar estrategias de marketing personal (personal branding) en las redes sociales y prevenir los riesgos reputacionales.","La identitat digital professional es construeix i es gestiona: cal analitzar la pròpia petjada i la reputació en línia, aplicar estratègies de màrqueting personal (personal branding) a les xarxes socials i prevenir els riscos reputacionals."]}],"acts":["s3-huella"],"videos":[],"part":1,"time":["35 min","35 min"]},{"num":3,"kind":"theory","title":["2.5.3. Recursos digitales: protección de datos, IA y salud digital","2.5.3. Recursos digitals: protecció de dades, IA i salut digital"],"nodes":[{"t":"p","x":["Son herramientas y aplicaciones en la nube para gestionar candidaturas y actualizar alertas de empleo. Su uso exige conocer el marco legal, utilizar la IA con responsabilidad y cuidar la salud digital.","Són eines i aplicacions al núvol per gestionar candidatures i actualitzar alertes d'ocupació. El seu ús exigeix conèixer el marc legal, fer servir la IA amb responsabilitat i tenir cura de la salut digital."]},{"t":"viz","v":{"type":"cards","items":[{"i":"lock","s":"must","x":["Protección de datos","Protecció de dades"],"d":["Reglamento General de Protección de Datos (RGPD, UE 2016/679) y Ley Orgánica 3/2018 (LOPDGDD): tratamiento del CV, cesión de datos a intermediarios y derechos digitales en el entorno laboral.","Reglament General de Protecció de Dades (RGPD, UE 2016/679) i Llei orgànica 3/2018 (LOPDGDD): tractament d s pasadas para predecir el desempeño futuro","Conductes passades per predir l'acompliment futur"],"exp":["Apartado 2.6.1.","Apartat 2.6.1."]}],"block":"S3","origin":"complementaria"},{"id":"A3UD2","code":"A3UD2","type":"teacher","origin":"manual","time":["75 min","75 min"],"kind":["Evaluación","Avaluació"],"group":["Individual y por parejas","Individual i per parelles"],"mode":["Escape room por fases y reto de reputación digital","Escape room per fases i repte de reputació digital"],"ra":"RA5","ce":"a, b, c, d, e, f, g, h","title":["Misión Marca Digital. Escape room y reto de reputación digital: «Agente 360»","Missió Marca Digital. Escape room i repte de reputació digital: «Agent 360»"],"statement":[{"t":"p","x":["Te conviertes en agente de empleabilidad digital y debes preparar una candidatura segura, atractiva y ética. La misión combina una auditoría de tu huella digital, la creación de un perfil Europass, una carta de presentación y la resolución de dilemas sobre privacidad, IA y salud digital.","Et converteixes en agent d'ocupabilitat digital i has de preparar una candidatura segura, atractiva i ètica. La missió combina una auditoria de la teva petjada digital, la creació d'un perfil Europass, una carta de presentació i la resolució de dilemes sobre privacitat, IA i salut digital."]},{"t":"list","k":"ul","l":1,"items":[["Fase 1 — Auditoría de identidad: busca tu nombre en modo incógnito y detecta la información pública, los riesgos reputacionales y las oportunidades de mejora.","Fase 1 — Auditoria d'identitat: cerca el teu nom en mode incògnit i detecta la informació pública, els riscos reputacionals i les oportunitats de millora."],["Fase 2 — Perfil profesional: completa un CV Europass y una autoevaluación de competencias digitales con DigComp.","Fase 2 — Perfil professional: completa un CV Europass i una autoavaluació de competències digitals amb DigComp."],["Fase 3 — Candidatura: redacta una carta de presentación adaptada a una oferta concreta con Canva o Google Docs.","Fase 3 — Candidatura: redacta una carta de presentació adaptada a una oferta concreta amb Canva o Google Docs."],["Fase 4 — Dilemas digitales: responde a situaciones sobre el uso de la IA, la protección de datos (RGPD y LOPDGDD), la fatiga digital y la desconexión.","Fase 4 — Dilemes digitals: respon a situacions sobre l'ús de la IA, la protecció de dades (RGPD i LOPDGDD), la fatiga digital i la desconnexió."]],"start":1},{"t":"p","x":["Resultado esperado: un dossier digital con la auditoría de marca personal, el CV Europass, la carta de presentación y decisiones justificadas sobre protección de datos y uso responsable de la IA.","Resultat esperat: un dossier digital amb l'auditoria de marca personal, el CV Europass, la carta de presentació i decisions justificades sobre protecció de dades i ús responsable de la IA."]},{"t":"p","x":["Gamificación: puntos por cada evidencia, medallas («Ciudadano digital responsable», «Perfil profesional visible», «Experto en privacidad»), barra de progreso individual y desafíos por parejas. Al final, juega al Kahoot de la misión.","Gamificació: punts per cada evidència, medalles («Ciutadà digital responsable», «Perfil professional visible», «Expert en privacitat»), barra de progrés individual i desafiaments per parelles. Al final, juga al Kahoot de la missió."]}],"criteria":[{"ra":"RA5","title":["Aplica competencias digitales en el proceso de búsqueda de información y orientación profesional, relacionándolo con el sector productivo al que se dirige.","Aplica competències digitals en el procés de cerca d'informació i orientació professional, relacionant-lo amb el sector productiu al qual es dirigeix."],"ce":[["CE5a",["Se ha analizado el impacto de las tecnologías de la información y la comunicación (TIC), de la inteligencia artificial (IA) y de las redes sociales, entre otras, en los diferentes contextos y perfiles profesionales.","S'ha analitzat l'impacte de les tecnologies de la informació i la comunicació (d'ara endavant TIC), de la intel·ligència artificial (IA) i de les xarxes socials, entre altres, en els diferents contextos i perfils professionals."]],["CE5b",["Se han considerado las competencias técnicas y digitales como parte imprescindible del perfil profesional.","S'han considerat les competències tècniques i digitals com a part imprescindible del perfil professional."]],["CE5c",["Se ha recopilado información sobre el modo en que el alumnado destinatario puede utilizar las competencias digitales en la búsqueda activa de oportunidades laborales.","S'ha recopilat informació sobre el mode en què l'alumnat destinatari pot utilitzar les competències digitals en la cerca activa d'oportunitats laborals."]],["CE5d",["Se ha analizado la propia imagen digital, considerando la marca o reputación personal y profesional que se proyecta en internet.","S'ha analitzat la pròpia imatge digital, considerant la marca o reputació personal i professional que es projecta en internet."]],["CE5e",["Se ha considerado la legislación vigente en el tratamiento de la información y la protección de datos personales y derechos digitales, valorando la utilización responsable de las TIC, la IA y las redes sociales.","S'ha considerat la legislació vigent en el tractament de la informació i la protecció de dades personals i drets digitals, valorant la utilització responsable de les TIC, IA i xarxes socials."]],["CE5f",["Se han desarrollado acciones relacionadas con la salud digital en entornos formativo-profesionales, considerando la prevención de posibles adicciones tecnológicas o el uso inadecuado de las tecnologías.","S'han desenvolupat accions relacionades amb la salut digital en entorns formatiu-professionals, considerant la prevenció de possibles addiccions tecnològiques o l'ús inadequat de les tecnologies."]],["CE5g",["Se han concretado técnicas para la búsqueda, creación, modificación, compartición y gestión de contenidos digitales relacionados con el proceso de información y orientación laboral."," joc adaptats al RA5 (els facilita el docent)."],"block":"S3"},{"id":"ud2-eval","type":"mcq","origin":"manual","time":["25 min","25 min"],"ra":"RA1 · RA2 · RA3 · RA5","ce":["todos los de la UD2","tots els de la UD2"],"title":["Cuestionario de evaluación (UD2)","Qüestionari d'avaluació (UD2)"],"questions":[{"q":["¿Cuál de estos organismos públicos es la fuente institucional de referencia en España para la Encuesta de Población Activa (EPA) y los datos macroeconómicos de la actividad laboral?","Quin dels següents organismes públics és la font institucional de referència a Espanya per a la gestió de l'Enquesta de Població Activa (EPA) i l'obtenció de dades macroeconòmiques de l'activitat laboral?"],"opts":[["El Servicio Público de Empleo Estatal (SEPE).","El Servei Públic d'Ocupació Estatal (SEPE)."],["El Instituto Nacional de Estadística (INE).","L'Institut Nacional d'Estadística (INE)."],["El Consejo Económico y Social (CES).","El Consell Econòmic i Social (CES)."],["El Fondo Social Europeo (FSE).","El Fons Social Europeu (FSE)."]],"ans":1,"exp":["El INE es el organismo autónomo que elabora la EPA, fuente estadística primaria de referencia para analizar las tasas de actividad, empleo y paro (RA1.a).","L'INE és l'organisme autònom encarregat de l'elaboració de l'EPA, font estadística primària de referència per analitzar les taxes d'activitat, ocupació i atur (RA1.a)."]},{"q":["¿Cuál es la diferencia principal entre una agencia de colocación y una empresa de trabajo temporal (ETT)?","Quina diferència principal existeix entre una agència de col·locació i una empresa de treball temporal (ETT)?"],"opts":[["Las ETT no pueden hacer selección de personal, solo formación.","Les ETT no poden fer selecció de personal, només formació."],["La agencia contrata directamente al trabajador para cederlo a la empresa usuaria, y la ETT solo intermedia sin contratar.","L'agència de col·locació contracta directament el treballador per cedir-lo a l'empresa usuària, mentre que l'ETT només fa d'intermediària sense contractar."],["La ETT contrata al trabajador para ponerlo a disposición de una empresa usuaria mediante un contrato de puesta a disposición, mientras que la agencia intermedia sin ser la empleadora final.","L'ETT contracta el treballador per posar-lo a disposició d'una empresa usuària mitjançant un contracte de posada a disposició, mentre que l'agència de col·locació actua com a intermediària sense ser l'ocupadora final."],["Las agencias de colocación son siempre públicas y las ETT, siempre entidades privadas sin ánimo de lucro.","Les agències de col·locació són sempre públiques i les ETT són sempre entitats privades sense ànim de lucre."]],"ans":2,"exp":["La Ley 14/1994 regula las ETT con una relación triangular en la que la ETT es la empleadora formal; la agencia solo busca y conecta candidaturas con empresas (RA1.b, RA3.b).","La Llei 14/1994 regula les ETT establint la relació triangular en la qual l'ETT és l'ocupadora formal; l'agència de col·locació només cerca i connecta candidats amb empreses (RA1.b, RA3.b)."]},{"q":["Al diseñar una guía de recursos para el empleo y la formación de un sector, ¿cuál es el primer paso organizativo indispensable antes de publicarla?","En el disseny d'una guia de recursos per a l'ocupació i la formació d'un sector professional, quin és el primer pas organitzatiu indispensable abans de la seva publicació?"],"opts":[["Imprimir copias en papel para todo el alumnado.","Imprimir còpies físiques per a tot l'alumnat."],["Identificar, filtrar y verificar la vigencia de los datos de los agentes y recursos del territorio.","La identificació, filtratge i verificació de la vigència de les dades dels agents i recursos del territori."],["Enviar el CV de forma masiva a todas las empresas incluidas.","L'enviament massiu de CV a totes les empreses incloses."],["Contratar publicidad en redes sociales.","La contractació d'un servei de publicitat en xarxes socials."]],"ans":1,"exp":["Según el CE1.g, una guía rigurosa exige organizar, consultar y actualizar antes la información para que sea útil.","Conforme al criteri d'avaluació CE1.g, una guia rigorosa requereix accions d'organització, consulta i actualització prèvia de la informació per garantir-ne la utilitat."]},{"q":["¿Qué documento tiene como objetivo principal captar la atención de quien recluta, argumentar la adecuación al puesto y solicitar directamente una entrevista?","Quin document d'autopresentació té com a objectiu principal captar l'atenció del reclutador, argumentar la meva adequació al lloc i sol·licitar directament una entrevista de treball?"],"opts":[["El pasaporte Europass de lenguas.","El Passaport Europass de llengües."],["La carta de presentación.","La carta de presentació."],["El último contrato de trabajo.","El darrer contracte de treball executat."],["El certificado de vida laboral.","El certificat de vida laboral."]],"ans":1,"exp":["La carta personaliza la candidatura, contextualiza el CV e incluye la llamada a la acción para conseguir la entrevista (RA2.i).","La carta de presentació personalitza la candidatura, contextualitza el CV i inclou la crida a l'acció per aconseguir una entrevista (RA2.i)."]},{"q":["¿Qué plataforma y marco europeo normalizado permite crear un perfil profesional interoperable, evaluar las competencias digitales con DigComp y facilitar la movilidad laboral en la UE?","Quina plataforma i marc europeu normalitzat permet a la ciutadania crear un perfil professional interoperable, avaluar les seves competències digitals segons el marc DigComp i facilitar la mobilitat laboral a la UE?"],"opts":[["InfoJobs.","InfoJobs."],["El ecosistema y perfil Europass de la Comisión Europea.","L'ecosistema i perfil Europass de la Comissió Europea."],["El repositorio Dialnet.","El repositori Dialnet."],["La red social LinkedIn.","La xarxa social LinkedIn."]],"ans":1,"exp":["Europass integra herramientas de autoevaluación como DigComp y favorece la transparencia y la movilidad en la UE (RA5.b, RA5.g).","El perfil Europass integra eines d'autoavaluació com DigComp i afavoreix la transparència i la mobilitat a la UE (RA5.b, RA5.g)."]},{"q":["Cuando una persona orientadora o una empresa recoge CV digitales, ¿qué norma obliga a informar sobre el tratamiento de los datos personales y a obtener el consentimiento o la legitimación?","Quan un orientador o una empresa recull currículums digitals en un procés d'orientació o selecció, quina norma legal obliga a informar sobre el tractament de dades personals i obtenir el consentiment o legitimació corresponent?"],"opts":[["La Ley sobre Infracciones y Sanciones en el Orden Social (LISOS).","La Llei d'Infraccions i Sancions en l'Ordre Social (LISOS)."],["El RGPD y la LOPDGDD 3/2018.","El Reglament General de Protecció de Dades (RGPD) i la LOPDGDD 3/2018."],["Exclusivamente el Real Decreto 86/2026.","El Reial decret 86/2026 exclusivament."],["La Ley de Prevención de Riesgos Laborales.","La Llei de prevenció de riscos laborals."]],"ans":1,"exp":["El tratamiento de datos curriculares está sujeto a la legislación de protección de datos y derechos digitales (CE5.e): minimización y consentimiento o legitimación.","El tractament de dades curriculars està vinculat a la legislació de protecció de dades personals i drets digitals (CE5.e): minimització i consentiment o legitimació."]},{"q":["¿Qué se entiende por «huella digital» en la búsqueda activa de empleo?","Què s'entén per «petjada digital» o imatge digital en el context de la cerca activa d'ocupació?"],"opts":[["La marca de agua de la foto del CV Europass.","La marca d'aigua que s'inclou en la foto del CV Europass."],["El rastro de datos, publicaciones e interacciones que una persona deja en internet y que configura su reputación en línea ante quienes reclutan.","El rastre de dades, informacions, publicacions i interaccions que una persona deixa a internet i que configura la seva reputació en línia davant dels reclutadors."],["El número de seguidores en una red social de ocio.","El nombre de seguidors totals en una xarxa social d'oci."],["La firma electrónica del contrato de trabajo.","La signatura electrònica utilitzada per signar el contracte de treball."]],"ans":1,"exp":["La marca y la reputación digital (CE5.d) se analizan evaluando la visibilidad y la huella que se proyectan en la red.","La marca i reputació digital (CE5.d) s'analitza avaluant la visibilitat i la petjada que el candidat projecta a la xarxa."]},{"q":["¿Cuál es la finalidad principal del método STAR en la preparación de las entrevistas por competencias?","Quina és la finalitat principal de la metodologia STAR en la preparació de les entrevistes de treball per competències?"],"opts":[["Memorizar un discurso cerrado de 10 minutos sobre la vida personal.","Memoritzar un discurs tancat de 10 minuts sobre la vida personal."],["Estructurar las respuestas describiendo la situación, la tarea, la acción y el resultado de experiencias pasadas.","Estructurar les respostes descrivint la Situació, la Tasca, l'Acció realitzada i el Resultat obtingut en experiències passades."],["Evaluar la velocidad de mecanografía.","Avaluar la velocitat de mecanografia del candidat en entorns digitals."],["Responder solo «sí» o «no».","Respondre exclusivament amb afirmativa o negativa a les preguntes del reclutador."]],"ans":1,"exp":["STAR permite aportar evidencias de conductas pasadas (RA2.i, RA1.c).","La tècnica STAR permet a l'entrevistat demostrar evidències de conductes passades (RA2.i, RA1.c)."]},{"q":["Dentro de la salud digital en la búsqueda de empleo (RA5.f), ¿qué medida es fundamental para prevenir la fatiga o la ansiedad?","Dins de les accions de salut digital vinculades al procés de cerca d'ocupació (RA5.f), quina mesura és fonamental per prevenir la fatiga informàtica o ansietat laboral?"],"opts":[["Revisar los portales cada 15 minutos las 24 horas.","Revisar els portals d'ocupació cada 15 minuts durant les 24 hores del dia."],["Fijar horarios de búsqueda, automatizar alertas y practicar la desconexión digital.","Establir horaris delimitats de cerca activa, automatitzar alertes i practicar la desconnexió digital."],["Enviar el mismo CV de forma masiva sin leer los requisitos.","Enviar el mateix CV massivament sense llegir els requisits de les ofertes."],["Desactivar los filtros de seguridad del ordenador.","Desactivar tots els filtres de seguretat de l'ordinador."]],"ans":1,"exp":["La salud digital (CE5.f) implica un uso equilibrado de la tecnología y delimitar la actividad de búsqueda.","La salut digital (CE5.f) implica la prevenció del desgast o l'ansietat mitjançant l'ús equilibrat de la tecnologia i la delimitació de l'activitat de cerca."]},{"q":["¿Qué red oficial europea ofrece información, orientación y selección de personal a trabajadores y empresas interesados en la movilidad laboral en el Espacio Económico Europeo?","Quina xarxa oficial europea ofereix serveis d'informació, orientació i selecció de personal per a treballadors i ocupadors interessats en la mobilitat laboral en l'espai econòmic europeu?"],"opts":[["La red EURES (European Employment Services).","La xarxa EURES (European Employment Services)."],["El Registro Mercantil Central.","El Registre Mercantil Central."],["Exclusivamente la agencia Erasmus+ Juventud.","L'agència Erasmus+ Joventut en Acció exclusivament."],["El portal del BOE.","El portal BOE."]],"ans":0,"exp":["EURES es la red de cooperación de la Comisión Europea y los servicios públicos de empleo para la libre circulación de trabajadores (RA3.b, RA1.b).","EURES és la xarxa de cooperació de la Comissió Europea i els serveis públics d'ocupació nacionals per facilitar la lliure circulació de treballadors a la UE (RA3.b, RA1.b)."]}],"block":"S3"}],"notes":[["Texto de la unidad: programación didáctica de la UD2 (en catalán) y temario de la UD2 (en castellano); cada texto se ha traducido con fidelidad al otro idioma. Los criterios de evaluación son el texto completo del documento «Estructuración UD2 y RAs».","Text de la unita ncias tecnológicas o verdes.","Repte 1 — Vertader o fals: automatització, nous jaciments d'ocupació i demanda de competències tecnològiques o verdes."],["Reto 2 — Clasificación: cada profesión a su sector (tecnología y datos, sostenibilidad, atención a las personas o audiovisual digital).","Repte 2 — Classificació: cada professió al seu sector (tecnologia i dades, sostenibilitat, atenció a les persones o audiovisual digital)."],["Reto 3 — Selección de fuentes: elige los recursos más adecuados para buscar empleo y formación (SEPE, EURES, portales de empleo, redes profesionales, consultorías).","Repte 3 — Selecció de fonts: tria els recursos més adequats per cercar feina i formació (SEPE, EURES, portals d'ocupació, xarxes professionals, consultories)."],["Reto final — Mini caso: una persona cuyo puesto administrativo repetitivo puede automatizarse; elige las mejores estrategias de actualización profesional.","Repte final — Minicas: una persona el lloc administratiu repetitiu de la qual es pot automatitzar; tria les millors estratègies d'actualització professional."]],"start":1}],"criteria":[{"ra":"RA1","title":["Selecciona cauces informativos y estrategias de búsqueda y actualización de la información del entorno profesional y productivo, reflejándolos en la programación de orientación profesional de los grados A, B y C.","Selecciona llits informatius i estratègies de cerca i actualització de la informació de l'entorn professional i productiu, reflectint-los en la programació d'orientació professional dels graus A, B i C."],"ce":[["CE1a",["Se han identificado las fuentes que ofrecen una visión actualizada del contexto sociolaboral, analizando las empresas u organismos equiparados del sector productivo y las condiciones y recursos del entorno.","S'han identificat les fonts que ofereixen una visió actualitzada del context sociolaboral, analitzant les empreses o organismes equiparats del sector productiu i les condicions i recursos de l'entorn."]],["CE1b",["Se han determ   }
  function validReport() {
    if (!S.student.name.trim() || !S.student.group.trim()) {
      toast(t("needId")); window.scrollTo(0, 0);
      var el = document.getElementById(!S.student.name.trim() ? "st-name" : "st-group");
      if (el) { var dd = el.closest("details"); if (dd) dd.open = true; el.focus(); }
      return false;
    }
    if (collect().doneN === 0 && !window.confirm(t("emptyWarn"))) return false;
    return true;
  }
  function generateReport(scope) {
    REP = scope && scope.k ? scope : null;
    if (validReport()) openOv("report");
  }
  function printReport() {
    var fo = document.getElementById("finalobs"), pv = document.getElementById("finalobs-print");
    if (fo && pv) { pv.textContent = fo.value || "—"; pv.style.display = ""; fo.parentNode.querySelector("textarea").style.display = "none"; }
    document.body.classList.add("print-report");
    var old = document.title; document.title = "Informe_" + (M.short || "Web") + "_" + (REP ? REP.id : t("day") + C.day) + "_" + slug(S.student.name);
    window.print();
    setTimeout(function () {
      document.title = old; document.body.classList.remove("print-report");
      if (fo && pv) { pv.style.display = "none"; fo.style.display = ""; }
    }, 600);
  }
  function copyReport() {
    var txt = reportPlain(collect());
    var fb = document.getElementById("copyfallback");
    function fallback() { fb.style.display = "block"; fb.value = txt; fb.focus(); fb.select(); toast(t("copyFail")); }
    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(txt).then(function () { toast(t("copied")); }, function () {
        fb.value = txt; fb.style.display = "block"; fb.select();
        try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
        fallback();
      });
    } else {
      fb.value = txt; fb.style.display = "block"; fb.select();
      try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
      fallback();
    }
  }
  window.addEventListener("afterprint", function () { document.body.classList.remove("print-report"); });

  // API mínima per a proves automàtiques
  window.PRL = { state: function () { return S; }, report: function () { return reportPlain(collect()); }, go: go, setLang: setLang };
  render();
})();

</script>
